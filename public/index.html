<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #11161e;
      --bg-card: #1e2632;
      --bg-card-hover: #27313f;
      --border: #36435a;
      --text: #d3dbe6;
      --text-dim: #96a3b5;
      --text-bright: #f0f4f9;
      --green: #00ff88;
      --yellow: #ffcc00;
      --red: #ff6161;
      --grey: #8b96a5;
      --blue: #4dabf7;
      --bar-bg: #2b3746;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #root { max-width: 1400px; margin: 0 auto; padding: 20px; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header-stats {
      display: flex;
      gap: 24px;
      font-size: 13px;
    }
    .stat-label { color: var(--text-dim); margin-right: 6px; }
    .stat-value { color: var(--text-bright); font-weight: 500; }
    .stat-value.cost { color: var(--green); }

    /* --- Grid --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }

    /* --- Session Card --- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .card:hover { background: var(--bg-card-hover); }
    .card.status-thinking { border-left: 3px solid var(--green); }
    .card.status-waiting  { border-left: 3px solid var(--yellow); }
    .card.status-error    { border-left: 3px solid var(--red); }
    .card.status-idle     { border-left: 3px solid #ff8800; opacity: 0.92; }
    .card.status-idle-stale { border-left: 3px solid var(--border); opacity: 0.35; }
    /* Faded cards come back to full strength on hover, so they stay readable
       when you actually want to inspect one. */
    .card.status-idle:hover,
    .card.status-idle-stale:hover { opacity: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.thinking { background: var(--green); animation: pulse 1.5s infinite; }
    .status-dot.waiting  { background: var(--yellow); animation: pulse 2s infinite; }
    .status-dot.error    { background: var(--red); }
    .status-dot.idle     { background: var(--grey); }
    .status-dot.idle-stale { background: var(--grey); }

    .card-status {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .card-status.thinking { color: var(--green); background: rgba(0,255,136,0.1); }
    .card-status.waiting  { color: var(--yellow); background: rgba(255,204,0,0.1); }
    .card-status.error    { color: var(--red); background: rgba(255,68,68,0.1); }
    .card-status.idle     { color: var(--grey); background: rgba(139,150,165,0.14); }
    .card-status.idle-stale { color: var(--text-dim); background: rgba(150,163,181,0.12); }

    .perm-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .perm-badge.bypass { color: var(--red); background: rgba(255,68,68,0.15); }
    .perm-badge.accept-edits { color: var(--yellow); background: rgba(255,204,0,0.12); }

    /* Subagents */
    .subagents {
      margin-bottom: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .subagents-header {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .subagent {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 0;
      width: 100%;
      background: none;
      border: none;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .subagent:hover { background: rgba(255,255,255,0.04); }
    .subagent-caret {
      color: var(--text-dim);
      flex-shrink: 0;
      min-width: 8px;
    }
    .subagent-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .subagent-dot.thinking { background: var(--green); animation: pulse 1.5s infinite; }
    .subagent-dot.done { background: var(--grey); }
    /* Never colour alone: the dot is always paired with this word. */
    .subagent-status {
      flex-shrink: 0;
      min-width: 30px;
      font-weight: 500;
    }
    .subagent-status.thinking { color: var(--green); }
    .subagent-status.done { color: var(--text-dim); }
    .subagent-task {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .subagent-tokens {
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .subagent-detail {
      margin: 2px 0 8px 12px;
      padding-left: 8px;
      border-left: 1px solid var(--border);
    }
    .subagent-summary {
      font-size: 11px;
      color: var(--text-dim);
      padding: 2px 0 4px;
    }
    .subagent-report {
      font-size: 11px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 340px;
      overflow-y: auto;
      margin: 4px 0 6px;
    }
    .subagent-task-full {
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 140px;
      overflow-y: auto;
      margin: 4px 0 6px;
      padding-left: 6px;
      border-left: 2px solid var(--border);
    }
    .subagent-block-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      margin-top: 6px;
    }
    .subagent-steps-toggle {
      background: none;
      border: none;
      padding: 2px 0;
      font-family: inherit;
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
    }
    .subagent-steps-toggle:hover { color: var(--text); }
    .subagent-detail .log-feed { max-height: 240px; }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .meta-item {
      display: flex;
      justify-content: space-between;
    }
    .meta-key { color: var(--text-dim); }
    .meta-val { color: var(--text); font-weight: 500; }
    .meta-val.cost { color: var(--green); }

    /* Context bar */
    .context-bar-container {
      margin-bottom: 12px;
    }
    .context-bar-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .context-bar {
      height: 4px;
      background: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }
    .context-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Active files */
    .active-files {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .file-tag {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--bar-bg);
      border-radius: 3px;
      color: var(--blue);
    }

    /* Recent log */
    .log-toggle {
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      padding: 4px 0;
    }
    .log-toggle:hover { color: var(--text); }

    .stale-toggle {
      font-size: 11px;
      font-family: inherit;
      color: var(--text-dim);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 9px;
      cursor: pointer;
    }
    .stale-toggle:hover { color: var(--text); border-color: var(--text-dim); }
    .stale-toggle.on { color: var(--blue); border-color: var(--blue); }

    .search-box {
      font-size: 11px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 9px;
      width: 150px;
    }
    .search-box::placeholder { color: var(--text-dim); }
    .search-box:focus { outline: none; border-color: var(--blue); }

    .usage-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 16px;
    }
    .usage-stats { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
    .usage-item { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
    .usage-item .k { color: var(--text-dim); }
    .usage-item .v { color: var(--text-bright); font-weight: 500; }
    .usage-item .v.cost { color: var(--green); }
    .usage-model {
      font-size: 11px;
      color: var(--text-dim);
      border-left: 1px solid var(--border);
      padding-left: 22px;
    }
    .spark { display: flex; align-items: flex-end; gap: 2px; height: 30px; }
    .spark-col {
      width: 6px;
      min-height: 1px;
      background: var(--blue);
      border-radius: 1px 1px 0 0;
      opacity: 0.65;
    }
    .spark-col.today { background: var(--green); opacity: 1; }
    .spark-col:hover { opacity: 1; }
    .spark-wrap { display: flex; align-items: flex-end; gap: 10px; }
    .spark-max { font-size: 10px; color: var(--text-dim); white-space: nowrap; }

    .dot.offline { background: var(--red); animation: none; }
    .link-state { font-size: 11px; color: var(--text-dim); }
    .link-state.offline { color: var(--red); font-weight: 600; }
    .log-feed {
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.6;
    }
    .log-entry {
      display: flex;
      gap: 8px;
      color: var(--text-dim);
    }
    .log-time { color: var(--text-dim); flex-shrink: 0; min-width: 55px; }
    .log-type { flex-shrink: 0; min-width: 40px; font-weight: 500; }
    .log-type.tool  { color: var(--blue); }
    .log-type.think { color: var(--green); }
    .log-type.user  { color: var(--yellow); }
    .log-type.error { color: var(--red); }
    .log-msg {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }
    .empty h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .empty p { font-size: 13px; }

    /* Git branch */
    .git-branch {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-card); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const { useState, useEffect, useCallback, useRef } = React;
    const e = React.createElement;

    function formatNumber(n) {
      if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(2) + 'B';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
      return String(n);
    }

    function formatCost(c) {
      return '$' + c.toFixed(4);
    }

    function startedLabel(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      const clock = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (mins < 60) return clock + ' (' + mins + 'm)';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return clock + ' (' + hrs + 'h ' + (mins % 60) + 'm)';
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + clock;
    }

    function timeAgo(iso) {
      if (!iso) return '-';
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function formatTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDuration(ms) {
      if (!ms || ms < 0) return '';
      const secs = Math.round(ms / 1000);
      if (secs < 60) return secs + 's';
      const mins = Math.floor(secs / 60);
      if (mins < 60) return mins + 'm ' + (secs % 60) + 's';
      return Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm';
    }

    function contextPercent(lastTurnInputTotal, limit) {
      return Math.min(100, (lastTurnInputTotal / (limit || 200_000)) * 100);
    }

    function formatLimit(limit) {
      return limit >= 1_000_000
        ? (limit / 1_000_000) + 'M'
        : Math.round(limit / 1000) + 'K';
    }

    function contextBarColor(pct) {
      if (pct > 80) return 'var(--red)';
      if (pct > 50) return 'var(--yellow)';
      return 'var(--blue)';
    }

    function UsageBar({ usage }) {
      if (!usage) return null;
      const series = usage.series || [];
      const max = Math.max(...series.map(r => r.costUSD), 0.01);
      const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const stat = (k, v, cost) => e('span', { className: 'usage-item' },
        e('span', { className: 'k' }, k),
        e('span', { className: 'v' + (cost ? ' cost' : '') }, v)
      );

      return e('div', { className: 'usage-bar' },
        e('div', { className: 'usage-stats' },
          stat('Today', money(usage.todayCost), true),
          stat('7 days', money(usage.cost7d), true),
          stat('30 days', money(usage.cost30d), true),
          stat('Tokens today', formatNumber(usage.todayTokens)),
          stat('30 days', formatNumber(usage.tokens30d)),
          usage.topModel && e('span', { className: 'usage-model' }, 'mostly ' + usage.topModel)
        ),
        e('div', { className: 'spark-wrap' },
          e('div', { className: 'spark' },
            series.map((r, i) => e('div', {
              key: r.date,
              className: 'spark-col' + (i === series.length - 1 ? ' today' : ''),
              style: { height: Math.max(1, (r.costUSD / max) * 30) + 'px' },
              title: r.date + '  $' + r.costUSD.toFixed(2)
            }))
          ),
          e('span', { className: 'spark-max' }, 'peak $' + max.toFixed(0))
        )
      );
    }

    function SubagentRow({ sessionId, sub }) {
      const [open, setOpen] = useState(false);
      const [detail, setDetail] = useState(null);
      // A running agent has no report yet, so its steps are what you watch.
      const [showSteps, setShowSteps] = useState(sub.status === 'thinking');

      // Transcripts are read from disk on click; keep polling only while it runs.
      useEffect(() => {
        if (!open) return;
        let alive = true;
        const load = () => fetch('/api/sessions/' + sessionId + '/subagents/' + sub.agentId)
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (alive && d) setDetail(d); })
          .catch(() => {});
        load();
        if (sub.status !== 'thinking') return () => { alive = false; };
        const iv = setInterval(load, 2000);
        return () => { alive = false; clearInterval(iv); };
      }, [open, sessionId, sub.agentId, sub.status]);

      const label = sub.status === 'thinking' ? 'run' : 'done';

      return e('div', null,
        e('button', {
          className: 'subagent',
          onClick: () => setOpen(!open),
        },
          e('span', { className: 'subagent-caret' }, open ? '-' : '+'),
          e('span', { className: 'subagent-dot ' + sub.status }),
          e('span', { className: 'subagent-status ' + sub.status }, label),
          e('span', { className: 'subagent-task' }, sub.task || sub.agentId),
          e('span', { className: 'subagent-tokens' }, formatNumber(sub.tokensOut) + ' out')
        ),

        open ? e('div', { className: 'subagent-detail' },
          e('div', { className: 'subagent-summary' },
            [
              sub.agentType,
              sub.model,
              sub.toolCount ? sub.toolCount + ' tools' : '',
              formatDuration(detail ? detail.durationMs : 0),
            ].filter(Boolean).join(' \u00b7 ')
          ),
          !detail ? e('div', { className: 'subagent-summary' }, 'Loading...') : null,

          detail && detail.task
            ? e(React.Fragment, null,
                e('div', { className: 'subagent-block-label' }, 'TASK'),
                e('div', { className: 'subagent-task-full' }, detail.task)
              )
            : null,

          detail && detail.result
            ? e('div', { className: 'subagent-block-label' }, 'REPORT')
            : null,

          detail && detail.result
            ? e('div', { className: 'subagent-report' }, detail.result)
            : null,

          detail ? e('button', {
            className: 'subagent-steps-toggle',
            onClick: () => setShowSteps(!showSteps),
          }, (showSteps ? '- steps' : '+ steps (' + detail.steps.length + ')')) : null,

          detail && showSteps
            ? e('div', { className: 'log-feed' },
                detail.steps.slice().reverse().map((entry, i) =>
                  e('div', { key: i, className: 'log-entry' },
                    e('span', { className: 'log-time' }, formatTime(entry.time)),
                    e('span', { className: 'log-type ' + entry.type }, entry.type),
                    e('span', { className: 'log-msg' }, entry.msg)
                  )
                )
              )
            : null
        ) : null
      );
    }

    function SessionCard({ session }) {
      const [expanded, setExpanded] = useState(false);
      const [log, setLog] = useState([]);

      // The list endpoint no longer ships logs; pull them only for open cards.
      useEffect(() => {
        if (!expanded) return;
        let alive = true;
        const load = () => fetch('/api/sessions/' + session.sessionId + '/log')
          .then(r => r.ok ? r.json() : [])
          .then(d => { if (alive) setLog(d); })
          .catch(() => {});
        load();
        const iv = setInterval(load, 2000);
        return () => { alive = false; clearInterval(iv); };
      }, [expanded, session.sessionId]);
      const st = session.status;
      const pct = contextPercent(session.lastTurnInputTotal || session.tokensIn, session.contextLimit);

      return e('div', { className: 'card status-' + st },
        // Header
        e('div', { className: 'card-header' },
          e('div', null,
            e('div', { className: 'card-label',
              style: session.cwd ? { cursor: 'pointer' } : {},
              onClick: session.cwd ? (ev) => {
                fetch('/api/open-folder', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ path: session.cwd })
                }).then(r => {
                  if (!r.ok) {
                    const el = ev.currentTarget;
                    el.style.textDecoration = 'line-through';
                    el.title = 'Folder not found: ' + session.cwd;
                  }
                });
              } : undefined,
              title: session.cwd || ''
            },
              e('span', { className: 'status-dot ' + st }),
              session.label || session.sessionId.substring(0, 8)
            ),
            session.gitBranch ? e('div', { className: 'git-branch' }, session.gitBranch) : null
          ),
          e('div', { style: { display: 'flex', gap: '6px', alignItems: 'center' } },
            session.permissionMode === 'bypassPermissions'
              ? e('span', { className: 'perm-badge bypass' }, 'YOLO')
              : session.permissionMode === 'acceptEdits'
              ? e('span', { className: 'perm-badge accept-edits' }, 'AUTO-EDIT')
              : null,
            e('span', { className: 'card-status ' + st }, st)
          )
        ),

        // Meta grid
        e('div', { className: 'card-meta' },
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Model'),
            e('span', { className: 'meta-val' }, session.model || '-')
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Cost'),
            e('span', { className: 'meta-val cost' }, formatCost(session.costUSD))
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Output'),
            e('span', { className: 'meta-val' }, formatNumber(session.tokensOut))
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Cache Read'),
            e('span', { className: 'meta-val' }, formatNumber(session.cacheReadIn || 0))
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Turns'),
            e('span', { className: 'meta-val' }, session.turnCount)
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Last Event'),
            e('span', { className: 'meta-val' }, timeAgo(session.lastEventAt))
          ),
          e('div', { className: 'meta-item' },
            e('span', { className: 'meta-key' }, 'Started'),
            e('span', { className: 'meta-val', title: session.startedAt || '' },
              startedLabel(session.startedAt))
          )
        ),

        // Context bar
        e('div', { className: 'context-bar-container' },
          e('div', { className: 'context-bar-label' },
            e('span', null, 'Context Window'),
            e('span', null, pct.toFixed(0) + '% of ' + formatLimit(session.contextLimit || 200_000))
          ),
          e('div', { className: 'context-bar' },
            e('div', { className: 'context-bar-fill', style: {
              width: pct + '%',
              background: contextBarColor(pct)
            }})
          )
        ),

        // Active files
        session.activeFiles.length > 0
          ? e('div', { className: 'active-files' },
              session.activeFiles.map((f, i) => e('span', { key: i, className: 'file-tag' }, f))
            )
          : null,

        // Subagents
        session.subagents && session.subagents.length > 0
          ? e('div', { className: 'subagents' },
              e('div', { className: 'subagents-header' }, 'Subagents (' + session.subagents.length + ')'),
              session.subagents.map(sub =>
                e(SubagentRow, { key: sub.agentId, sessionId: session.sessionId, sub })
              )
            )
          : null,

        // Log toggle + feed
        e('button', {
          className: 'log-toggle',
          onClick: () => setExpanded(!expanded)
        }, expanded ? '- Hide log' : '+ Show log (' + (session.logCount || 0) + ')'),

        expanded ? e('div', { className: 'log-feed' },
          log.slice().reverse().map((entry, i) =>
            e('div', { key: i, className: 'log-entry' },
              e('span', { className: 'log-time' }, formatTime(entry.time)),
              e('span', { className: 'log-type ' + entry.type }, entry.type),
              e('span', { className: 'log-msg' }, entry.msg)
            )
          )
        ) : null
      );
    }

    function Dashboard() {
      const [sessions, setSessions] = useState([]);
      const [lastFetch, setLastFetch] = useState(() => Date.now());
      const [totals, setTotals] = useState(null);
      const [usage, setUsage] = useState(null);
      const [now, setNow] = useState(Date.now());
      const lastFetchRef = useRef(lastFetch);
      lastFetchRef.current = lastFetch;
      const [hideStale, setHideStale] = useState(() => {
        try { return localStorage.getItem('hideStale') === '1'; } catch { return false; }
      });
      const [showAll, setShowAll] = useState(() => {
        try { return localStorage.getItem('showAll') === '1'; } catch { return false; }
      });
      const [query, setQuery] = useState('');
      const [alerts, setAlerts] = useState(() => {
        try { return localStorage.getItem('alerts') === '1'; } catch { return false; }
      });
      const notified = useRef(new Set());

      const toggleAlerts = useCallback(() => {
        setAlerts(v => {
          const next = !v;
          try { localStorage.setItem('alerts', next ? '1' : '0'); } catch {}
          if (next && 'Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
          }
          return next;
        });
      }, []);

      const toggleStale = useCallback(() => {
        setHideStale(v => {
          const next = !v;
          try { localStorage.setItem('hideStale', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      const toggleShowAll = useCallback(() => {
        setShowAll(v => {
          const next = !v;
          try { localStorage.setItem('showAll', next ? '1' : '0'); } catch {}
          return next;
        });
      }, []);

      const fetchSessions = useCallback(() => {
        fetch('/api/sessions' + (showAll ? '?all=1' : ''))
          .then(r => { if (!r.ok) throw new Error('bad status'); return r.json(); })
          .then(data => {
            setSessions(data.sessions || []);
            setTotals(data.totals || null);
            setUsage(data.usage || null);
            const t = Date.now();
            setLastFetch(t);
            setNow(t);
          })
          .catch(() => setLastFetch(v => v)); // keep the old time so staleness shows
      }, [showAll]);

      useEffect(() => {
        fetchSessions();
        const iv = setInterval(fetchSessions, 2000);
        const tick = setInterval(() => setNow(n =>
          Date.now() - lastFetchRef.current > 5000 ? Date.now() : n), 1000);
        return () => { clearInterval(iv); clearInterval(tick); };
      }, [fetchSessions]);

      const staleMs = now - lastFetch;
      const offline = staleMs > 10000;

      const staleCount = sessions.filter(s => s.status === 'idle-stale').length;
      const q = query.trim().toLowerCase();
      const visible = sessions
        .filter(s => !hideStale || s.status !== 'idle-stale')
        .filter(s => !q || (
          (s.label || '').toLowerCase().includes(q) ||
          (s.gitBranch || '').toLowerCase().includes(q) ||
          (s.model || '').toLowerCase().includes(q)
        ));

      // A session is 'waiting' when Claude has answered and wants you. Fire once
      // per visit, and re-arm when the session goes busy again.
      const waiting = sessions.filter(s => s.status === 'waiting');
      useEffect(() => {
        document.title = waiting.length
          ? '(' + waiting.length + ') Claude Code Dashboard'
          : 'Claude Code Dashboard';
        const live = new Set(waiting.map(s => s.sessionId));
        for (const id of notified.current) {
          if (!live.has(id)) notified.current.delete(id);
        }
        if (!alerts || !('Notification' in window) || Notification.permission !== 'granted') return;
        for (const s of waiting) {
          if (notified.current.has(s.sessionId)) continue;
          notified.current.add(s.sessionId);
          new Notification('Claude needs you', {
            body: s.label + (s.gitBranch ? ' (' + s.gitBranch + ')' : ''),
            tag: s.sessionId,
          });
        }
      }, [waiting.map(s => s.sessionId).join(','), alerts]);

      const totalCost = totals ? totals.costUSD : sessions.reduce((s, x) => s + x.costUSD, 0);
      const totalOut = totals ? totals.tokensOut : sessions.reduce((s, x) => s + x.tokensOut, 0);
      const activeSessions = sessions.filter(s => s.status === 'thinking' || s.status === 'waiting').length;

      return e('div', null,
        // Header
        e('div', { className: 'header' },
          e('div', { className: 'header-title' },
            e('span', { className: 'dot' + (offline ? ' offline' : '') }),
            'Claude Code Dashboard'
          ),
          e('div', { className: 'header-stats' },
            e('span', null,
              e('span', { className: 'stat-label' }, 'Sessions'),
              e('span', { className: 'stat-value' },
                activeSessions + '/' + sessions.length +
                (totals && totals.sessionCount > sessions.length
                  ? ' of ' + totals.sessionCount : ''))
            ),
            e('span', null,
              e('span', { className: 'stat-label' }, 'Output'),
              e('span', { className: 'stat-value' }, formatNumber(totalOut) + ' out')
            ),
            e('span', null,
              e('span', { className: 'stat-label' }, 'Cost'),
              e('span', { className: 'stat-value cost' }, formatCost(totalCost))
            ),
            e('span', { className: 'link-state' + (offline ? ' offline' : '') },
              offline
                ? 'no data for ' + Math.floor(staleMs / 1000) + 's'
                : 'live'),
            e('input', {
              className: 'search-box',
              type: 'search',
              placeholder: 'filter projects...',
              value: query,
              onChange: ev => setQuery(ev.target.value)
            }),
            staleCount > 0 && e('button', {
              className: 'stale-toggle' + (hideStale ? ' on' : ''),
              onClick: toggleStale,
              title: 'Sessions with no activity today'
            }, (hideStale ? 'show' : 'hide') + ' stale (' + staleCount + ')'),
            e('button', {
              className: 'stale-toggle' + (showAll ? ' on' : ''),
              onClick: toggleShowAll,
              title: 'By default only the newest idle session per project is listed'
            }, showAll ? 'all sessions' : 'newest only'),
            e('button', {
              className: 'stale-toggle' + (alerts ? ' on' : ''),
              onClick: toggleAlerts,
              title: 'Desktop notification when a session is waiting for you'
            }, alerts ? 'alerts on' : 'alerts off')
          )
        ),

        e(UsageBar, { usage }),

        // Cards
        visible.length === 0
          ? e('div', { className: 'empty' },
              e('h2', null, sessions.length === 0 ? 'No sessions detected' : 'Nothing matches'),
              e('p', null, sessions.length === 0
                ? 'Start a Claude Code session in any terminal to see it here.'
                : 'Clear the filter, or click "show stale" to include older sessions.')
            )
          : e('div', { className: 'grid' },
              visible.map(s => e(SessionCard, { key: s.sessionId, session: s }))
            )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(Dashboard));
  </script>
</body>
</html>
